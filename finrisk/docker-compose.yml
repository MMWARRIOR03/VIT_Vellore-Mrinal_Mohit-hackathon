version: "3.9"

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: finrisk_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── API server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: finrisk-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /app/data/finrisk.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Standalone NLP worker (advanced / optional) ──────────────────────────────
  # The API starts the NLP worker by default (NLP_WORKER_ENABLED=true), so this
  # service is opt-in.  Do not enable it unless NLP_WORKER_ENABLED=false is set
  # for the API as well; otherwise two workers consume raw.articles.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: finrisk-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /app/data/finrisk.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - standalone-worker
    restart: unless-stopped

  # ── Live ingestion (opt-in via --profile live) ────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: finrisk-ingestion
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /app/data/finrisk.duckdb
      INGESTION_ENABLED: "true"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - live
    restart: unless-stopped

  # ── Streamlit dashboard ───────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: finrisk-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DUCKDB_PATH: /app/data/finrisk.duckdb
      # Inside Compose, localhost is the dashboard container itself. Use the
      # API service hostname so dashboard reads stay out of DuckDB's writer lock.
      API_BASE_URL: http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
