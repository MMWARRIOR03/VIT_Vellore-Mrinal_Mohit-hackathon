<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">FinRisk end-to-end architecture</title>
  <desc id="desc">Four market information sources flow through ingestion, Redis, NLP and RiskSignal generation to index rebalancing, portfolio stress testing, durable storage, and the Streamlit dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#101b34"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#177ea8"/><stop offset="1" stop-color="#25d9ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowCyan" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2bd9ff"/></marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9d8cff"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4be28c"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff5f6d"/></marker>
    <style>
      .title { font-family:Arial,Helvetica,sans-serif; font-size:47px; font-weight:700; fill:#f5f7ff; }
      .subtitle { font-family:Arial,Helvetica,sans-serif; font-size:20px; fill:#b6c5e3; }
      .section { font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; letter-spacing:2px; fill:#7f93ba; }
      .cardtitle { font-family:Arial,Helvetica,sans-serif; font-size:21px; font-weight:700; fill:#f5f7ff; }
      .cardtext { font-family:Arial,Helvetica,sans-serif; font-size:15px; fill:#afbedc; }
      .small { font-family:Arial,Helvetica,sans-serif; font-size:13px; fill:#a4b4d2; }
      .pill { font-family:Arial,Helvetica,sans-serif; font-size:13px; font-weight:700; fill:#d8f7ff; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M0 245H1920M0 788H1920" stroke="#2a3a60" stroke-opacity=".75"/>
  <text x="80" y="94" class="title">FinRisk — event-to-decision architecture</text>
  <text x="80" y="132" class="subtitle">A frozen RiskSignal is the auditable contract between source intelligence, portfolio actions, and the user-facing risk view.</text>
  <rect x="80" y="168" width="138" height="5" rx="2.5" fill="#2bd9ff"/>

  <!-- source lane -->
  <text x="80" y="225" class="section">01 / INFORMATION SOURCES</text>
  <g filter="url(#shadow)">
    <rect x="80" y="274" width="230" height="112" rx="16" fill="#14213d" stroke="#6659d8" stroke-width="2"/>
    <rect x="338" y="274" width="230" height="112" rx="16" fill="#14213d" stroke="#6659d8" stroke-width="2"/>
    <rect x="596" y="274" width="230" height="112" rx="16" fill="#14213d" stroke="#6659d8" stroke-width="2"/>
    <rect x="854" y="274" width="230" height="112" rx="16" fill="#14213d" stroke="#6659d8" stroke-width="2"/>
  </g>
  <text x="108" y="320" class="cardtitle">GDELT news</text><text x="108" y="350" class="cardtext">global market coverage</text>
  <text x="366" y="320" class="cardtitle">SEC EDGAR</text><text x="366" y="350" class="cardtext">filings and disclosures</text>
  <text x="624" y="320" class="cardtitle">StockTwits</text><text x="624" y="350" class="cardtext">social sentiment stream</text>
  <text x="882" y="320" class="cardtitle">Tweet replay</text><text x="882" y="350" class="cardtext">offline demo data</text>
  <path d="M195 411 V450 H1166" fill="none" stroke="#9d8cff" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M453 411 V450" fill="none" stroke="#9d8cff" stroke-width="3"/>
  <path d="M711 411 V450" fill="none" stroke="#9d8cff" stroke-width="3"/>
  <path d="M969 411 V450" fill="none" stroke="#9d8cff" stroke-width="3"/>

  <!-- signal factory -->
  <text x="80" y="522" class="section">02 / SIGNAL FACTORY</text>
  <g filter="url(#shadow)">
    <rect x="80" y="558" width="255" height="144" rx="16" fill="#14213d" stroke="#2bd9ff" stroke-width="2"/>
    <rect x="415" y="558" width="294" height="144" rx="16" fill="#14213d" stroke="#2bd9ff" stroke-width="2"/>
    <rect x="789" y="542" width="344" height="176" rx="18" fill="url(#signal)" stroke="#6de9ff" stroke-width="2"/>
  </g>
  <text x="108" y="605" class="cardtitle">Ingestion layer</text>
  <text x="108" y="635" class="cardtext">deduplicate · ticker link</text><text x="108" y="660" class="cardtext">cluster · normalize</text>
  <text x="443" y="605" class="cardtitle">NLP / enrichment</text>
  <text x="443" y="635" class="cardtext">FinBERT sentiment · event type</text><text x="443" y="660" class="cardtext">novelty · propagation · impact</text>
  <text x="822" y="594" class="cardtitle">Frozen RiskSignal</text>
  <text x="822" y="626" class="cardtext" fill="#e9fcff">tickers · sentiment · confidence</text><text x="822" y="651" class="cardtext" fill="#e9fcff">impact · provenance · explanation</text><text x="822" y="680" class="pill">ONE AUDITABLE CONTRACT</text>
  <path d="M335 630 H415" fill="none" stroke="#2bd9ff" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M709 630 H789" fill="none" stroke="#2bd9ff" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <rect x="80" y="730" width="1053" height="34" rx="17" fill="#1a2b4a"/>
  <text x="106" y="753" class="pill">Redis Streams  ·  raw.articles  →  processed.signals  →  signals.rebalance / signals.stress</text>

  <!-- decision lane -->
  <text x="1246" y="225" class="section">03 / DECISION ENGINES</text>
  <g filter="url(#shadow)">
    <rect x="1246" y="274" width="270" height="176" rx="18" fill="#14213d" stroke="#4be28c" stroke-width="2"/>
    <rect x="1580" y="274" width="270" height="176" rx="18" fill="#14213d" stroke="#ff5f6d" stroke-width="2"/>
  </g>
  <text x="1274" y="321" class="cardtitle">Module A</text><text x="1274" y="350" class="cardtext">Tactical Index Rebalancer</text><text x="1274" y="384" class="small">bounded weight tilts</text><text x="1274" y="409" class="small">rebalance-event audit trail</text>
  <text x="1608" y="321" class="cardtitle">Module B</text><text x="1608" y="350" class="cardtext">Portfolio Stress Tester</text><text x="1608" y="384" class="small">historical shock + P&amp;L</text><text x="1608" y="409" class="small">Student-t Monte Carlo · VaR / ES</text>
  <path d="M1133 586 H1190 V362 H1246" fill="none" stroke="#4be28c" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1133 674 H1190 V362 H1580" fill="none" stroke="#ff5f6d" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1198" y="349" class="small">signal trigger</text>

  <!-- evidence + UI -->
  <text x="1246" y="522" class="section">04 / EVIDENCE &amp; EXPERIENCE</text>
  <g filter="url(#shadow)">
    <rect x="1246" y="558" width="270" height="144" rx="16" fill="#14213d" stroke="#9d8cff" stroke-width="2"/>
    <rect x="1580" y="558" width="270" height="144" rx="16" fill="#14213d" stroke="#2bd9ff" stroke-width="2"/>
  </g>
  <text x="1274" y="605" class="cardtitle">DuckDB</text><text x="1274" y="635" class="cardtext">signals · stress runs</text><text x="1274" y="660" class="cardtext">rebalance history</text>
  <text x="1608" y="605" class="cardtitle">Streamlit dashboard</text><text x="1608" y="635" class="cardtext">live feed · explorer</text><text x="1608" y="660" class="cardtext">Module A · Module B</text>
  <path d="M1381 450 V558" fill="none" stroke="#9d8cff" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M1715 450 V558" fill="none" stroke="#2bd9ff" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <path d="M1516 630 H1580" fill="none" stroke="#2bd9ff" stroke-width="3" marker-end="url(#arrowCyan)"/>

  <rect x="80" y="908" width="1770" height="90" rx="18" fill="#101d36" stroke="#2a3a60"/>
  <text x="112" y="947" class="cardtitle">Design principle</text>
  <text x="112" y="978" class="subtitle">The dashboard reads the same persisted signals and module outputs that power decisions—keeping the demo explainable, reproducible, and reviewable.</text>
  <text x="1805" y="1040" class="small" text-anchor="end">FINRISK · ARCHITECTURE</text>
</svg>
